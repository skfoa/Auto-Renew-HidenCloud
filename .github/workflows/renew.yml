name: Auto Renew HidenCloud 

on:
  workflow_dispatch:
  schedule:
    - cron: '30 05 * * 6' # 根据到期时间在星期几 提前一天,比如星期三到期，cron写星期二即可

permissions:
  actions: write
  contents: write

jobs:
  Renew-HidenCloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright requests 'requests[socks]'
          python -m playwright install --with-deps chrome
          
      - name: ⚙ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: ⏰ 更新 README 保活时间戳并推送
        if: always()
        run: |
          python3 -c "
          import datetime, re
          tz = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S')
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          new_content = re.sub(
              r'<!-- AUTO_KEEPALIVE_START -->[\s\S]*?<!-- AUTO_KEEPALIVE_END -->',
              f'<!-- AUTO_KEEPALIVE_START -->\n- **最后保活更新时间 (UTC+8)**: {now}\n<!-- AUTO_KEEPALIVE_END -->',
              content
          )
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: 自动更新保活时间戳 [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || git push
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
